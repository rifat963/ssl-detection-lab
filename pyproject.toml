[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssl-detection-lab"
version = "0.3.1"
description = "SSL pretraining, comprehensive evaluation, and video analysis for Ultralytics models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Dr Mohammad Rifat Ahmmad Rashid"},
]
dependencies = [
  "numpy>=1.24",
  "Pillow>=9.5",
  "PyYAML>=6.0",
  "torch>=2.0",
  "torchvision>=0.15",
  "tqdm>=4.65",
  "ultralytics>=8.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
ssldet = "ssldet.main_cli:main"
ssldet-pretrain = "ssldet.cli:main"
ssldet-models = "ssldet.main_cli:models_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
