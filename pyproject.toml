[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssl-detection-lab"
version = "0.5.0"
description = "SSL pretraining, comprehensive evaluation, and video analysis for Ultralytics models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  {name = "Dr Mohammad Rifat Ahmmad Rashid"},
]
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "PyYAML>=6.0.2",
  "torch>=2.4",
  "torchvision>=0.19",
  "tqdm>=4.66",
  "ultralytics>=8.4.96",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.12"]
dinov3 = ["torch>=2.7.1"]

[project.scripts]
ssldet = "ssldet.main_cli:main"
ssldet-pretrain = "ssldet.cli:main"
ssldet-models = "ssldet.main_cli:models_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
